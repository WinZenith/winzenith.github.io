# Stringhe UI in italiano. Le chiavi sono il testo sorgente, tranne le chiavi help.*.
help.intro=Fai clic su una sezione qui sotto per espanderla e scoprire come usare quella funzione.
help.contact=Se hai una domanda, hai trovato un bug o vuoi suggerire un miglioramento, ci farebbe piacere sentirti. Inviaci un'email a:
help.email.copied=Indirizzo email copiato negli appunti: winzenith_tools@yahoo.com
help.section.0=La dashboard è il tuo hub di panoramica del sistema. Fai clic su "Scansiona problemi" per controllare driver obsoleti, aggiornamenti software e opportunità di pulizia del sistema in parallelo. I risultati appaiono in schede riepilogative e in una tabella (Categoria | Problemi trovati | Dimensione | Origine | Stato). Fai clic su una riga di categoria per passare direttamente a quella scheda. Usa "Interrompi" per annullare e "Riprova" se una categoria scade o fallisce. L'ultima scansione viene ripristinata all'apertura. La dashboard è di sola lettura — non modifica mai il sistema. Rispetta i driver esclusi e il software saltato.
help.section.1=La scheda Driver esegue la scansione dei dispositivi installati e controlla Windows Update, le sorgenti live NVIDIA/Intel e i vendor supportati dal catalogo quando sono disponibili dati aggiornati (configura WINZENITH_CATALOG_URL per aggiornare). Fai clic su "Scansiona" per rilevare gli aggiornamenti. Ogni riga obsoleta mostra Dispositivo, versione Corrente vs Disponibile, Gravità (Critica / Importante / Consigliata / Opzionale / Sconosciuta, più badge REBOOT e ISSUE) e Salute (Eccellente / Buona / Discreta / Scarsa). Seleziona le righe e fai clic su "Aggiorna selezionati" o "Aggiorna tutti", oppure usa "Aggiorna" per riga. Usa "Ignora" e "Ignorati" per nascondere i driver, "Cronologia" per verificare le installazioni, "Dettagli" / "Confronta" per le info complete e "Cerca..." per filtrare. "Backup" esegue il backup di tutti i driver. "Interrompi" / "Interrompi installazione" / "Interrompi backup" annullano l'operazione in corso. Sono richiesti i diritti di amministratore. Prima dell'installazione l'app esegue controlli preliminari, può fare il backup automatico dei driver e creare un punto di ripristino se abilitato, blocca pacchetti pre-release / non attendibili / non firmati e può chiedere un download manuale dal vendor. I driver in attesa di riavvio restano elencati con un badge REBOOT finché non riavvii.
help.section.2=Questa scheda ha tre sotto-schede. "Ripristina driver" elenca i backup dei driver creati automaticamente prima degli aggiornamenti. Usa "Aggiorna", "Cerca backup...", "Dettagli", "Apri cartella", "Verifica" e "Ripara" per gestirli. Seleziona una riga e fai clic su "Ripristina" per ripristinare quella versione del driver (admin richiesto, potrebbe essere necessario un riavvio). "Elimina" rimuove un backup; "Elimina tutti" li rimuove tutti (conferma in due passaggi — il ripristino diventa poi impossibile). Nulla viene eliminato automaticamente. "Ripristino di sistema" è di sola lettura: fai clic su "Scansiona" per elencare i punti, "Crea nuovo punto di ripristino" per crearne uno (admin richiesto) e "Avvia punto di ripristino" per aprire la procedura guidata di Ripristino configurazione di sistema di Windows — l'app non ripristina né elimina mai i punti da sola. "Backup registro" esegue il backup delle aree del registro relative all'avvio: fai clic su "Esegui backup", scegli aree core / estese più l'esportazione completa dell'hive opzionale, poi "Ripristina selezionati" (unisce i file .reg; i file .hiv richiedono un ripristino reg manuale) o "Elimina backup".
help.section.3=Questa scheda usa winget e Windows Update per cercare aggiornamenti di app e di Windows. Fai clic su "Scansiona" per controllare ("Interrompi scansione" annulla). I risultati mostrano Programma, Versione corrente / disponibile, Origine (winget / WindowsUpdate), Dimensione e Stato (nessun livello di gravità). Usa Cerca, filtro Origine e "Solo falliti" per restringere i risultati, poi "Seleziona tutto" / "Deseleziona tutto" e "Aggiorna selezionati", oppure "Aggiorna" per riga. Gli elementi falliti possono essere ritentati con "Riprova falliti" (max 3 tentativi). Se abilitato, l'app offre un Punto di ripristino di sistema prima del batch. Un requisito di riavvio interrompe il batch rimanente — riavvia e scansiona di nuovo. Dopo un'installazione riuscita ti viene chiesto di eliminare i file di setup rilevati in Download per liberare spazio. "Ignora" per riga o "Elenco ignorati" nasconde le app finché non vengono riabilitate. "Cronologia" verifica installazioni OK / Fallite.
help.section.4=La scheda Informazioni di sistema mostra dati hardware e software dettagliati. Fai clic su "Carica informazioni di sistema" per interrogare, "Aggiorna" per i dati più recenti, "Annulla" per interrompere. L'ultimo snapshot viene mostrato subito all'apertura. Le informazioni sono organizzate in schede mostrate solo quando esistono dati: Panoramica, CPU, GPU, RAM, OS, Archiviazione, Scheda madre, Rete, Audio, Batteria, Temperature, Altro, Dispositivi USB, Monitor, Stampanti, più Avvisi (con tempi di raccolta) se qualcosa è fallito. Altro usa un elenco per categoria; Rete, Audio, USB, Monitor e Stampanti hanno ciascuno la propria casella di ricerca. Fai clic su "Esporta..." per salvare come TXT, JSON o HTML, "Copia tutto" per il report completo o "Copia scheda" per la scheda visibile. Compare un banner se non si è amministratori (temperature / NVMe potrebbero non essere disponibili). Questa scheda è di sola lettura e non modifica alcuna impostazione di sistema. I nomi dei campi e i valori raccolti restano in inglese.
help.section.5=La scheda Disinstalla elenca le app installate. Attiva/disattiva "App desktop" / "App Microsoft Store" (l'elenco/rimozione Store riguarda l'utente Windows corrente), fai clic su "Scansiona" ("Annulla" interrompe l'elenco e il caricamento delle dimensioni; una disinstallazione vendor Win32 attiva viene lasciata terminare in sicurezza, mentre le rimozioni Store e winget vengono abortite) e usa "Cerca app..." per filtrare. Seleziona un'app e fai clic su "Disinstalla" (esegue il disinstallatore del vendor, Interattivo o Silenzioso), oppure "Disinstalla forzatamente" come ultima risorsa senza di esso. Seleziona 2+ app e fai clic su "Disinstalla selezionati" per rimuoverle una per una — ogni app chiede ancora conferma, modalità e punto di ripristino. Dopo la disinstallazione, l'app cerca file, cartelle e voci di registro residui. Esaminali nella finestra dei residui: i file vanno nel Cestino per impostazione predefinita (recuperabili), le chiavi di registro vengono prima salvate in .reg (selezionate per impostazione predefinita). Solo le corrispondenze esatte sono preselezionate; le corrispondenze euristiche mostrano un badge e restano deselezionate. Usa "Solo alta affidabilità" per tornare alla selezione più sicura, "Seleziona tutto" / "Deseleziona tutto" / "Esporta elenco..." se necessario. Le voci PATH sono mostrate in sola lettura. Usa "Cronologia" per verificare le disinstallazioni passate, "Esporta..." per salvare l'elenco app come CSV e "Apri cartella" / "Copia" per i dettagli. Se una voce non ha disinstallatore, l'app offre un fallback winget (con conferma). Fai attenzione alla disinstallazione forzata — termina processi ed elimina file/registro/voci del menu Start e non può essere annullata.
help.section.6=Questa scheda gestisce i programmi di avvio e i tipi di avvio dei servizi Windows. Gli elementi sono organizzati in "App di avvio" (Registry Run/RunOnce + cartella Startup), "Attività pianificate" e "Servizi Windows" (con conteggi). La scheda servizi elenca tutti i servizi Windows (Automatico, Manuale e Disabilitato); i servizi Manuali mostrano impatto di avvio stimato zero. Gli elementi della cartella Startup (Utente e Common) sono uniti in App di avvio e attivati/disattivati tramite StartupApproved (compatibile con Task Manager); le rinominazioni legacy .disabled sono ancora riconosciuti. I servizi non possono essere eliminati, solo attivati/disattivati. Fai clic su "Scansiona" ("Interrompi" annulla e mantiene i risultati precedenti), poi seleziona un elemento e fai clic su "Abilita/Disabilita" o "Elimina". Solo "Elimina" crea un backup in Backup e ripristino; l'attivazione/disattivazione no. Disabilitare un servizio di sistema critico richiede una conferma aggiuntiva. Usa la ricerca per scheda più i filtri "Stato:" / "Impatto:", "Seleziona ad alto impatto" per selezionare gli elementi abilitati pesanti, e clic destro / doppio clic per "Apri percorso file", "Copia comando", "Mostra dettagli" e ricerca online. Il piè di pagina mostra il ritardo di avvio totale stimato (solo elementi abilitati) e l'ora dell'ultimo avvio. Usa "Backup e ripristino" per ripristinare o eliminare definitivamente i backup, e "Esporta CSV" per la scheda visibile. Modificare HKLM / Common Startup, attività o servizi di sistema richiede i diritti di amministratore. Modifica solo elementi che riconosci.
help.section.7=La scheda Pulizia di sistema cerca file non necessari. Fai clic su "Scansiona" ("Annulla" la interrompe) per analizzare categorie come file temporanei, cache dei browser, residui di Windows Update e file di log. Ogni categoria mostra Dimensione / Conteggio recuperabile più Rischio (Basso / Medio / Alto), Stato e Tempo impiegato. Usa Cerca e il filtro Rischio per restringere i risultati. Fai doppio clic su una riga (o clic destro > "Visualizza dettagli...") per un'anteprima di ciò che verrà pulito. Seleziona le categorie e fai clic su "Pulisci selezionati" (le categorie ad alto rischio partono deselezionate e chiedono conferma aggiuntiva). Usa "Aggiorna selezionati" per riscansionare solo le righe selezionate, "Preimpostazioni..." per selezioni salvate, "Esporta..." per salvare la scansione come CSV, "Cronologia" per le sessioni passate e clic destro > "Ignora categoria nelle scansioni future" per saltare una categoria ("Ignorati..." ripristina le categorie saltate). Se Registro è selezionato ti viene offerto un backup .reg; un punto di Ripristino di sistema può essere creato automaticamente se abilitato. Alcune categorie richiedono admin. Esamina sempre i risultati prima di pulire.
help.section.8=La scheda Strumenti disco ha quattro schede interne: Defrag, Salute disco, Benchmark e Cancellazione sicura. Defrag: fai clic su "Aggiorna", seleziona le unità visibili (Filtro Tutti / HDD / SSD si applica ad Analizza / Defrag intelligente), fai clic su "Analizza selezionati", poi "Defrag intelligente". La deframmentazione completa viene eseguita solo su HDD confermati; SSD e supporti sconosciuti ottengono ReTrim. Una griglia a colori visualizza la frammentazione. Defrag intelligente richiede admin. Salute disco: fai clic su "Aggiorna" per i dati SMART. Benchmark: scegli un'unità e una dimensione, fai clic su "Avvia benchmark" per lettura/scrittura sequenziale, IOPS e latenza ("Interrompi" annulla). Cancellazione sicura: eliminazione sicura di file e cartelle, pulizia del Cestino e cancellazione dello spazio libero. Cancellazione e sovrascrittura sono irreversibili — i file in uso possono essere programmati per l'eliminazione al prossimo riavvio.
help.section.9=Questa scheda cerca le estensioni installate nei browser. Fai clic su "Scansiona tutti i browser" per una scansione parallela completa, oppure scegli un browser e fai clic su "Riscansiona browser". Usa "Annulla" per interrompere una scansione o un'attivazione/disattivazione in corso. Filtra per Browser, Stato, Profilo e ricerca a testo libero. Spunta "Scansione automatica all'apertura" per scansionare automaticamente. Seleziona le righe e fai clic su "Abilita" / "Disabilita" per attivare/disattivare senza disinstallare (i browser devono restare chiusi). Il clic destro offre cartella, copia, pagina dello store e azioni Ignora. Usa "Esporta..." per salvare l'elenco filtrato, "Ripristina backup..." per ripristinare un backup delle preferenze e "Gestisci ignorati" per esaminare gli elementi ignorati. Le modifiche hanno effetto dopo il riavvio del browser.
help.section.10=Il Network Optimizer ha sotto-schede (admin richiesto per le modifiche). "Schede di rete" elenca le interfacce; usa Filtro, "Aggiorna", "Abilita" / "Disabilita", "Rinnova IP" e "Esporta CSV". "Ottimizzazione" applica preset TCP/IP (Predefinito, Prestazioni massime, Stabilità massima, Gaming). Usa "Anteprima modifiche" e "Applica"; uno snapshot viene acquisito prima di ogni applicazione. "DNS e cache" può svuotare DNS, reimpostare lo stack di rete o Winsock e impostare i server DNS. Le diagnostiche (benchmark DNS, probe MTU, speed test, ping, traceroute) vengono eseguite solo quando le avvii. "Impostazioni scheda" è una vista di sola lettura. "Wi-Fi" mostra la connessione corrente, le reti vicine e i profili salvati. "Panoramica connessione" è di sola lettura (ipconfig, route, arp, netstat). "Cronologia modifiche" elenca le operazioni recenti. Un banner di riavvio può comparire dopo modifiche TCP e reset dello stack.
