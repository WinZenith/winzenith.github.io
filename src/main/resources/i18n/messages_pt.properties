# European Portuguese (Portugal) UI strings. Keys match messages.properties.
help.intro=Clique em qualquer secção abaixo para a expandir e saber como utilizar essa funcionalidade.
help.contact=Tem uma pergunta, encontrou um erro ou quer sugerir uma melhoria? Gostaríamos de ouvir a sua opinião. Envie-nos um e-mail para:
help.email.copied=Endereço de e-mail copiado para a área de transferência: winzenith_tools@yahoo.com
help.section.0=O Painel é o centro de visão geral do seu sistema. Clique em "Procurar problemas" para verificar Drivers Desatualizados, Atualizações de Software e oportunidades de Limpeza do Sistema em paralelo. Os resultados aparecem em cartões de resumo e numa tabela (Categoria | Problemas Encontrados | Tamanho | Origem | Estado). Clique numa linha de categoria para saltar diretamente para esse separador. Utilize "Parar" para cancelar e "Tentar novamente" se uma categoria expirar o tempo ou falhar. A sua última análise é restaurada ao abrir. O Painel é apenas de leitura — nunca altera o sistema. Respeita drivers excluídos e software ignorado.
help.section.1=O separador Drivers analisa os dispositivos instalados e consulta o Windows Update, fontes em direto NVIDIA/Intel e fornecedores com catálogo quando existem dados atualizados (configure WINZENITH_CATALOG_URL para atualizar). Clique em "Verificar" para detetar atualizações. Cada linha desatualizada mostra Dispositivo, versão Atual vs Disponível, Severidade (Crítico / Importante / Recomendado / Opcional / Desconhecido, mais distintivos REBOOT e ISSUE) e Saúde (Excelente / Bom / Razoável / Fraco). Marque linhas e clique em "Atualizar selecionados" ou "Atualizar tudo", ou use "Atualizar" por linha. Use "Ignorar" e "Ignorado" por linha para ocultar drivers, "Histórico" para auditar instalações, "Detalhes" / "Comparar" para informação completa e "Pesquisar..." para filtrar. "Cópia de segurança" faz cópia de segurança de todos os drivers. "Parar" / "Parar instalação" / "Parar backup" cancelam a operação em curso. São necessários direitos de administrador. Antes de instalar, a aplicação executa pré-verificações, pode fazer cópia automática dos drivers e criar um ponto de restauro se estiver ativado, bloqueia pacotes pré-lançamento / não fidedignos / não assinados e pode pedir uma transferência manual do fornecedor. Drivers à espera de reinício permanecem listados com o distintivo REBOOT até reiniciar.
help.section.2=Este separador tem três subseparadores. "Reverter drivers" lista as cópias de segurança de drivers criadas automaticamente antes das atualizações. Utilize "Atualizar", "Pesquisar cópias de segurança...", "Detalhes", "Abrir pasta", "Verificar" e "Reparar" para as gerir. Selecione uma linha e clique em "Reverter" para restaurar essa versão do driver (requer administrador; pode ser necessário reiniciar). "Eliminar" remove uma cópia; "Eliminar tudo" remove todas (confirmação em dois passos — a reversão fica então impossível). Nada é eliminado automaticamente. "Restauro do sistema" é apenas de leitura: clique em "Verificar" para listar pontos, "Criar novo ponto de restauro" para criar um (requer administrador) e "Iniciar ponto de restauro" para abrir o assistente de Restauro do Sistema do Windows — a aplicação nunca restaura nem elimina pontos por si. "Backup do registo" faz cópia das áreas do registo relacionadas com o arranque: clique em "Criar cópia de segurança agora", escolha áreas principais / alargadas mais a exportação opcional completa do hive, depois "Restaurar selecionados" (une ficheiros .reg; ficheiros .hiv precisam de restauro manual do reg) ou "Eliminar cópia de segurança".
help.section.3=Este separador usa winget e Windows Update para procurar atualizações de aplicações e do Windows. Clique em "Verificar" para verificar ("Parar verificação" cancela). Os resultados mostram Programa, Versão Atual / Disponível, Origem (winget / WindowsUpdate), Tamanho e Estado (sem níveis de severidade). Utilize Pesquisa, filtro de Origem e "Apenas com falha" para restringir os resultados, depois "Selecionar tudo" / "Desmarcar tudo" e "Atualizar selecionados", ou "Atualizar" por linha. Itens com falha podem ser repetidos com "Tentar falhas novamente" (máx. 3 tentativas). Se estiver ativado, a aplicação oferece um Ponto de Restauro do Sistema antes do lote. Um requisito de reinício interrompe o resto do lote — reinicie e volte a analisar. Após uma instalação bem-sucedida, é-lhe pedido que elimine os ficheiros de instalador detetados em Downloads para libertar espaço. "Ignorar" por linha ou "Lista de ignorados" oculta aplicações até deixarem de ser ignoradas. "Histórico" audita instalações OK / Com falha.
help.section.4=O separador Informações do Sistema apresenta dados detalhados de hardware e software. Clique em "Carregar informações do sistema" para consultar, "Atualizar" para atualizar, "Cancelar" para parar. O último instantâneo é mostrado de imediato ao abrir. A informação é organizada em separadores mostrados apenas quando existem dados: Resumo, CPU, GPU, RAM, OS, Armazenamento, Placa-mãe, Rede, Áudio, Bateria, Temperaturas, Outros, Dispositivos USB, Monitores, Impressoras, mais Avisos (com tempos de recolha) se algo falhou. Outros usa uma lista de categorias; Rede, Áudio, USB, Monitores e Impressoras têm cada um a sua caixa de pesquisa. Clique em "Exportar..." para guardar como TXT, JSON ou HTML, "Copiar tudo" para o relatório completo ou "Copiar separador" para o separador visível. Aparece um aviso quando não está a ser executado como administrador (temperaturas / NVMe podem ficar indisponíveis). Este separador é apenas de leitura e não modifica quaisquer definições do sistema. Os nomes dos campos e os valores recolhidos permanecem em inglês.
help.section.5=O separador Desinstalador lista as aplicações instaladas. Alterne "Aplicações de ambiente de trabalho" / "Aplicações da Windows Store" (a lista/remoção da Store é para o utilizador atual do Windows), clique em "Verificar" ("Cancelar" interrompe a listagem e o carregamento de tamanho; uma desinstalação Win32 ativa do fornecedor é deixada concluir em segurança, enquanto remoções da Store e do winget são abortadas), e use "Pesquisar aplicações..." para filtrar. Selecione uma aplicação e clique em "Desinstalar" (executa o desinstalador do fornecedor, Interativo ou Silencioso), ou "Desinstalação forçada" como último recurso sem ele. Selecione 2+ aplicações e clique em "Desinstalar selecionados" para as remover uma a uma — cada aplicação pede ainda confirmação, modo e ponto de restauro. Após a desinstalação, a aplicação procura ficheiros, pastas e entradas de registo restantes. Reveja-os no diálogo de restos: os ficheiros vão para a Reciclagem por predefinição (recuperáveis); as chaves de registo são primeiro guardadas em .reg (marcadas por predefinição). Apenas correspondências exatas são pré-selecionadas; correspondências heurísticas mostram um distintivo e ficam desmarcadas. Utilize "Apenas alta confiança" para repor a seleção mais segura, "Selecionar tudo" / "Desmarcar tudo" / "Exportar lista..." conforme necessário. Entradas PATH são mostradas apenas de leitura. Utilize "Histórico" para auditar desinstalações anteriores, "Exportar..." para guardar a lista de aplicações como CSV e "Abrir pasta" / "Copiar" para detalhes. Se uma entrada não tiver desinstalador, a aplicação oferece um recurso winget (com confirmação). Tenha cuidado com a desinstalação forçada — encerra processos e elimina ficheiros/registo/entradas do Menu Iniciar e não pode ser desfeita.
help.section.6=Este separador gere programas de arranque e tipos de início de serviços do Windows. Os itens estão organizados em "Aplicações de arranque" (Registry Run/RunOnce + Pasta de Inicialização), "Tarefas agendadas" e "Serviços do Windows" (com contagens). O separador de serviços lista todos os serviços do Windows (Automático, Manual e Desativado); serviços Manual mostram impacto estimado de arranque zero. Itens da Pasta de Inicialização (Utilizador e Comum) são unidos em Aplicações de arranque e alternados via StartupApproved (compatível com o Gestor de Tarefas); renomeações legadas .disabled ainda são reconhecidas. Os serviços não podem ser eliminados, apenas alternados. Clique em "Verificar" ("Parar" cancela e mantém os resultados anteriores), depois selecione um item e clique em "Ativar/Desativar" ou "Eliminar". Apenas "Eliminar" cria uma cópia de segurança em Cópias de segurança e restauro; alternar não cria. Desativar um serviço crítico do sistema pede confirmação extra. Utilize a pesquisa por separador mais os filtros "Estado:" / "Impacto:", "Selecionar alto impacto" para selecionar itens ativados pesados, e clique com o botão direito / duplo clique para "Abrir local do ficheiro", "Copiar comando", "Mostrar detalhes" e pesquisa online. O rodapé mostra o atraso total estimado de arranque (apenas itens ativados) e a hora do último arranque. Utilize "Cópias de segurança e restauro" para restaurar ou eliminar permanentemente cópias de segurança, e "Exportar CSV" para o separador visível. Modificar HKLM / Common Startup, tarefas ou serviços do sistema requer direitos de administrador. Modifique apenas itens que reconheça.
help.section.7=O separador Limpeza do Sistema procura ficheiros desnecessários. Clique em "Verificar" ("Cancelar" interrompe) para analisar categorias como ficheiros temporários, caches de navegador, restos do Windows Update e ficheiros de log. Cada categoria mostra Tamanho / Contagem recuperáveis mais Risco (Baixo / Médio / Alto), Estado e tempo gasto. Utilize Pesquisa e o filtro de Risco para restringir os resultados. Clique duas vezes numa linha (ou clique com o botão direito > "Ver detalhes...") para pré-visualizar o que será limpo. Selecione categorias e clique em "Limpar selecionados" (categorias de risco ALTO começam desmarcadas e pedem confirmação extra). Utilize "Atualizar selecionados" para voltar a analisar apenas as linhas selecionadas, "Predefinições..." para seleções guardadas, "Exportar..." para guardar a análise como CSV, "Histórico" para sessões anteriores e clique com o botão direito > "Ignorar categoria em verificações futuras" para ignorar uma categoria ("Ignorados..." restaura categorias ignoradas). Se Registo estiver selecionado, é oferecida uma cópia .reg; um ponto de Restauro do Sistema pode ser criado automaticamente se estiver ativado. Algumas categorias exigem administrador. Reveja sempre os resultados antes de limpar.
help.section.8=O separador Ferramentas de Disco tem quatro subseparadores: Desfragmentação, Saúde do Disco, Benchmark e Eliminação Segura. Desfragmentação: clique em "Atualizar", selecione as unidades visíveis (Filtrar Tudo / HDD / SSD aplica-se a Analisar / Desfragmentação inteligente), clique em "Analisar selecionados" e depois em "Desfragmentação inteligente". A desfragmentação completa corre apenas em HDDs confirmados; SSDs e meios desconhecidos recebem ReTrim. Uma grelha com código de cores visualiza a fragmentação. Desfragmentação inteligente requer administrador. Saúde do Disco: clique em "Atualizar" para dados SMART. Benchmark: escolha uma unidade e o tamanho, clique em "Iniciar benchmark" para leitura/escrita sequencial, IOPS e latência ("Parar" cancela). Eliminação Segura: eliminação segura de ficheiros e pastas, limpeza da Reciclagem e limpeza de espaço livre. A destruição e a limpeza são irreversíveis — ficheiros em uso podem ser agendados para eliminação no próximo reinício.
help.section.9=Este separador analisa os navegadores instalados em busca de extensões. Clique em "Verificar todos os navegadores" para uma análise paralela completa, ou escolha um navegador e clique em "Verificar navegador novamente". Utilize "Cancelar" para interromper uma análise ou alternância em curso. Filtre por Navegador, Estado, Perfil e pesquisa de texto livre. Marque "Verificação automática ao abrir" para analisar automaticamente. Selecione linhas e clique em "Ativar" / "Desativar" para alternar sem desinstalar (os navegadores devem permanecer fechados). O clique com o botão direito oferece ações de pasta, copiar, página da loja e ignorar. Utilize "Exportar..." para guardar a lista filtrada, "Restaurar backup..." para reverter uma cópia de preferências e "Gerir ignorados" para rever itens ignorados. As alterações entram em vigor após reiniciar o navegador.
help.section.10=O Otimizador de Rede tem subseparadores (administrador necessário para alterações). "Adaptadores de rede" lista as interfaces; utilize Filtro, "Atualizar", "Ativar" / "Desativar", "Renovar IP" e "Exportar CSV". "Otimização" aplica predefinições TCP/IP (Predefinição, Desempenho Máximo, Estabilidade Máxima, Jogos). Utilize "Pré-visualizar alterações" e "Aplicar"; é capturado um instantâneo antes de cada aplicação. "DNS e cache" pode limpar o DNS, repor a pilha de rede ou o Winsock e definir servidores DNS. Os diagnósticos (benchmark DNS, sonda MTU, teste de velocidade, ping, traceroute) só são executados quando clica neles. "Definições do adaptador" é uma vista apenas de leitura. "Wi-Fi" mostra a ligação atual, redes próximas e perfis guardados. "Vista geral da ligação" é apenas de leitura (ipconfig, route, arp, netstat). "Histórico de alterações" lista operações recentes. Pode aparecer um aviso de reinício após alterações TCP e reposições da pilha.
