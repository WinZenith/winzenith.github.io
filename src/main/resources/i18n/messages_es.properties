# Cadenas de la interfaz en español (España). Las claves son el texto fuente, excepto help.*.
help.intro=Haga clic en cualquier sección de abajo para expandirla y aprender a usar esa función.
help.contact=¿Tiene una pregunta, ha encontrado un error o quiere sugerir una mejora? Nos encantaría saber de usted. Envíenos un correo a:
help.email.copied=Dirección de correo copiada al portapapeles: winzenith_tools@yahoo.com
help.section.0=El Dashboard es el centro de resumen de su sistema. Haga clic en "Buscar problemas" para comprobar controladores desactualizados, actualizaciones de software y oportunidades de limpieza del sistema en paralelo. Los resultados aparecen en tarjetas de resumen y en una tabla (Categoría | Problemas encontrados | Tamaño | Origen | Estado). Haga clic en una fila de categoría para ir directamente a esa pestaña. Use "Detener" para cancelar y "Reintentar" si una categoría agota el tiempo o falla. Su último análisis se restaura al abrir. El Dashboard es de solo lectura — nunca modifica su sistema. Respeta los controladores excluidos y el software omitido.
help.section.1=La pestaña Controladores analiza los dispositivos instalados y consulta Windows Update, fuentes en vivo de NVIDIA/Intel y proveedores del catálogo cuando hay datos actualizados (configure WINZENITH_CATALOG_URL para actualizar). Haga clic en "Analizar" para detectar actualizaciones. Cada fila desactualizada muestra Dispositivo, versión Actual frente a Disponible, Gravedad (Crítica / Importante / Recomendada / Opcional / Desconocida, más insignias REBOOT e ISSUE) y Salud (Excelente / Buena / Regular / Mala). Marque filas y haga clic en "Actualizar seleccionados" o "Actualizar todos", o use "Actualizar" por fila. Use "Ignorar" e "Ignorados" por fila para ocultar controladores, "Historial" para auditar instalaciones, "Detalles" / "Comparar" para información completa y "Buscar..." para filtrar. "Copia de seguridad" respalda todos los controladores. "Detener" / "Detener instalación" / "Detener copia" cancelan la operación en curso. Se requieren derechos de administrador. Antes de instalar, la aplicación ejecuta comprobaciones previas, puede respaldar controladores automáticamente y crear un punto de restauración si está activado, bloquea paquetes preliminares / no confiables / sin firmar, y puede pedir una descarga manual del fabricante. Los controladores que esperan reinicio permanecen con la insignia REBOOT hasta que reinicie.
help.section.2=Esta pestaña tiene tres subpestañas. "Revertir controladores" enumera las copias de seguridad de controladores creadas automáticamente antes de las actualizaciones. Use "Actualizar", "Buscar copias...", "Detalles", "Abrir carpeta", "Verificar" y "Reparar" para gestionarlas. Seleccione una fila y haga clic en "Revertir" para restaurar esa versión del controlador (se requiere administrador; puede ser necesario reiniciar). "Eliminar" quita una copia; "Eliminar todo" quita todas (confirmación en dos pasos — después no será posible revertir). Nada se elimina automáticamente. "Restaurar sistema" es de solo lectura: haga clic en "Analizar" para listar puntos, "Crear nuevo punto de restauración" para crear uno (se requiere administrador) y "Iniciar punto de restauración" para abrir el asistente de Restaurar sistema de Windows — la aplicación nunca restaura ni elimina puntos por sí misma. "Copia del Registro" respalda áreas del Registro relacionadas con el inicio: haga clic en "Hacer copia ahora", elija áreas principales / ampliadas más la exportación opcional completa del hive, luego "Restaurar seleccionados" (combina archivos .reg; los archivos .hiv necesitan restauración manual con reg) o "Eliminar copia".
help.section.3=Esta pestaña usa winget y Windows Update para buscar actualizaciones de aplicaciones y de Windows. Haga clic en "Analizar" para comprobar ("Detener análisis" cancela). Los resultados muestran Programa, versión Actual / Disponible, Origen (winget / WindowsUpdate), Tamaño y Estado (sin niveles de gravedad). Use Buscar, el filtro de Origen y "Solo fallidos" para acotar resultados, luego "Seleccionar todo" / "Deseleccionar todo" y "Actualizar seleccionados", o "Actualizar" por fila. Los elementos fallidos se pueden reintentar con "Reintentar fallidos" (máx. 3 intentos). Si está activado, la aplicación ofrece un punto de restauración del sistema antes del lote. Un requisito de reinicio detiene el lote restante — reinicie y vuelva a analizar. Tras una instalación correcta se le pide eliminar los instaladores detectados en Descargas para liberar espacio. "Ignorar" por fila o "Lista de ignorados" oculta aplicaciones hasta que dejen de ignorarse. "Historial" audita instalaciones correctas / fallidas.
help.section.4=La pestaña Información del sistema muestra datos detallados de hardware y software. Haga clic en "Cargar información del sistema" para consultar, "Actualizar" para lo más reciente y "Cancelar" para detener. Su última instantánea se muestra al instante al abrir. La información se organiza en pestañas que solo aparecen cuando hay datos: Resumen, CPU, GPU, RAM, OS, Almacenamiento, Placa base, Red, Audio, Batería, Temperaturas, Otros, Dispositivos USB, Monitores, Impresoras, más Advertencias (con tiempos de recopilación) si algo falló. Otros usa una lista de categorías; Red, Audio, USB, Monitores e Impresoras tienen su propio cuadro de búsqueda. Haga clic en "Exportar..." para guardar como TXT, JSON o HTML, "Copiar todo" para el informe completo o "Copiar pestaña" para la pestaña visible. Aparece un aviso si no se ejecuta como administrador (temperaturas / NVMe pueden no estar disponibles). Esta pestaña es de solo lectura y no modifica la configuración del sistema. Los nombres de campo y los valores recopilados permanecen en inglés.
help.section.5=La pestaña Desinstalador enumera las aplicaciones instaladas. Alterne "Aplicaciones de escritorio" / "Aplicaciones de Windows Store" (la lista/eliminación de Store es para el usuario actual de Windows), haga clic en "Analizar" ("Cancelar" detiene el listado y la carga de tamaños; una desinstalación Win32 del fabricante en curso se deja terminar con seguridad, mientras que las eliminaciones de Store y winget se abortan) y use "Buscar aplicaciones..." para filtrar. Seleccione una aplicación y haga clic en "Desinstalar" (ejecuta el desinstalador del fabricante, Interactivo o Silencioso), o "Forzar desinstalación" como último recurso sin él. Seleccione 2 o más aplicaciones y haga clic en "Desinstalar seleccionadas" para quitarlas una a una — cada aplicación sigue pidiendo confirmación, modo y punto de restauración. Tras la desinstalación, la aplicación busca archivos, carpetas y entradas del Registro restantes. Revíselos en el diálogo de restos: los archivos van a la Papelera de reciclaje por defecto (recuperables), las claves del Registro se respaldan primero en .reg (marcado por defecto). Solo las coincidencias exactas se preseleccionan; las heurísticas muestran una insignia y quedan sin marcar. Use "Solo alta confianza" para volver a la selección más segura, "Seleccionar todo" / "Deseleccionar todo" / "Exportar lista..." según necesite. Las entradas PATH se muestran en solo lectura. Use "Historial" para auditar desinstalaciones pasadas, "Exportar..." para guardar la lista de aplicaciones como CSV, y "Abrir carpeta" / "Copiar" para detalles. Si una entrada no tiene desinstalador, la aplicación ofrece un respaldo con winget (con confirmación). Tenga cuidado con la desinstalación forzada — mata procesos y elimina archivos/Registro/entradas del menú Inicio y no se puede deshacer.
help.section.6=Esta pestaña gestiona programas de inicio y tipos de inicio de servicios de Windows. Los elementos se organizan en "Aplicaciones de inicio" (Registro Run/RunOnce + carpeta de Inicio), "Tareas programadas" y "Servicios de Windows" (con recuentos). La pestaña de servicios enumera todos los servicios de Windows (Automático, Manual y Deshabilitado); los servicios Manuales muestran impacto de arranque estimado cero. Los elementos de la carpeta de Inicio (Usuario y Común) se fusionan en Aplicaciones de inicio y se alternan mediante StartupApproved (compatible con el Administrador de tareas); los renombrados .disabled antiguos siguen reconociéndose. Los servicios no se pueden eliminar, solo alternar. Haga clic en "Analizar" ("Detener" cancela y conserva los resultados anteriores), luego seleccione un elemento y haga clic en "Activar/Desactivar" o "Eliminar". Solo "Eliminar" crea una copia en Copias y restauración; alternar no lo hace. Desactivar un servicio crítico del sistema pide confirmación extra. Use la búsqueda por pestaña más los filtros "Estado:" / "Impacto:", "Seleccionar alto impacto" para seleccionar elementos pesados activados, y clic derecho / doble clic para "Abrir ubicación del archivo", "Copiar comando", "Mostrar detalles" y búsqueda en línea. El pie muestra el retraso total estimado de arranque (solo elementos activados) y la hora del último arranque. Use "Copias y restauración" para restaurar o eliminar permanentemente copias, y "Exportar CSV" para la pestaña visible. Modificar HKLM / Inicio común, tareas o servicios del sistema requiere derechos de administrador. Solo modifique elementos que reconozca.
help.section.7=La pestaña Limpieza del sistema busca archivos innecesarios. Haga clic en "Analizar" ("Cancelar" lo detiene) para analizar categorías como archivos temporales, cachés del navegador, restos de actualizaciones de Windows y archivos de registro. Cada categoría muestra Tamaño / Cantidad recuperable más Riesgo (Bajo / Medio / Alto), Estado y Tiempo empleado. Use Buscar y el filtro de Riesgo para acotar resultados. Haga doble clic en una fila (o clic derecho > "Ver detalles...") para previsualizar lo que se limpiará. Seleccione categorías y haga clic en "Limpiar seleccionadas" (las categorías de riesgo ALTO empiezan sin marcar y piden confirmación extra). Use "Actualizar seleccionadas" para volver a analizar solo las filas seleccionadas, "Preajustes..." para selecciones guardadas, "Exportar..." para guardar el análisis como CSV, "Historial" para sesiones pasadas, y clic derecho > "Ignorar categoría en futuros análisis" para omitir una categoría ("Ignoradas..." restaura las omitidas). Si se selecciona Registro se ofrece una copia .reg; se puede crear automáticamente un punto de Restaurar sistema si está activado. Algunas categorías requieren administrador. Revise siempre los resultados antes de limpiar.
help.section.8=La pestaña Herramientas de disco tiene cuatro pestañas internas: Desfragmentar, Salud del disco, Prueba de rendimiento y Borrado seguro. Desfragmentar: haga clic en "Actualizar", seleccione unidades visibles (el filtro Todo / HDD / SSD se aplica a Analizar / Desfragmentación inteligente), haga clic en "Analizar seleccionadas" y luego en "Desfragmentación inteligente". La desfragmentación completa solo se ejecuta en HDD confirmados; SSD y medios desconocidos reciben ReTrim. Una cuadrícula codificada por colores visualiza la fragmentación. La desfragmentación inteligente requiere administrador. Salud del disco: haga clic en "Actualizar" para datos SMART. Prueba de rendimiento: elija una unidad y un tamaño, haga clic en "Iniciar prueba" para lectura/escritura secuencial, IOPS y latencia ("Detener" cancela). Borrado seguro: eliminación segura de archivos y carpetas, limpieza de la Papelera de reciclaje y borrado de espacio libre. El borrado seguro y el vaciado son irreversibles — los archivos en uso se pueden programar para eliminar en el próximo reinicio.
help.section.9=Esta pestaña analiza los navegadores instalados en busca de extensiones. Haga clic en "Analizar todos los navegadores" para un análisis paralelo completo, o elija un navegador y haga clic en "Volver a analizar navegador". Use "Cancelar" para detener un análisis o un cambio en curso. Filtre por Navegador, Estado, Perfil y búsqueda de texto libre. Marque "Analizar automáticamente al abrir" para analizar automáticamente. Seleccione filas y haga clic en "Activar" / "Desactivar" para alternar sin desinstalar (los navegadores deben permanecer cerrados). El clic derecho ofrece carpeta, copiar, página de la tienda e ignorar. Use "Exportar..." para guardar la lista filtrada, "Restaurar copia..." para revertir una copia de preferencias y "Gestionar ignorados" para revisar elementos ignorados. Los cambios surten efecto tras reiniciar el navegador.
help.section.10=El Optimizador de red tiene subpestañas (se requiere administrador para los cambios). "Adaptadores de red" enumera interfaces; use Filtro, "Actualizar", "Activar" / "Desactivar", "Renovar IP" y "Exportar CSV". "Optimización" aplica preajustes TCP/IP (Predeterminado, Máximo rendimiento, Máxima estabilidad, Juegos). Use "Vista previa de cambios" y "Aplicar"; se captura una instantánea antes de cada aplicación. "DNS y caché" puede vaciar DNS, restablecer la pila de red o Winsock, y configurar servidores DNS. Los diagnósticos (prueba DNS, sonda MTU, prueba de velocidad, ping, traceroute) solo se ejecutan al hacer clic. "Configuración del adaptador" es una vista de solo lectura. "Wi-Fi" muestra la conexión actual, redes cercanas y perfiles guardados. "Resumen de conexión" es de solo lectura (ipconfig, route, arp, netstat). "Historial de cambios" enumera operaciones recientes. Puede aparecer un aviso de reinicio tras cambios TCP y restablecimientos de pila.
