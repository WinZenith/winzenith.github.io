# English UI strings. Keys are the source text, except help.* keys.
help.intro=Click on any section below to expand it and learn how to use that feature.
help.contact=If you have a question, found a bug, or want to suggest an improvement, we'd love to hear from you. Send us an email at:
help.email.copied=Email address copied to clipboard: winzenith_tools@yahoo.com
help.section.0=The Dashboard is your system overview hub. Click "Scan for issues" to check Outdated Drivers, Software Updates, and System Cleanup opportunities in parallel. Results appear in summary cards plus a table (Category | Issues Found | Size | Source | Status). Click a category row to jump directly to that tab. Use "Stop" to cancel and "Retry" if a category times out or fails. Your last scan is restored on open. The Dashboard is read-only — it never changes your system. It honors excluded drivers and skipped software.
help.section.1=The Drivers tab scans installed devices and checks Windows Update, live NVIDIA/Intel sources, and catalog-backed vendors when fresh catalog data is available (configure WINZENITH_CATALOG_URL to refresh). Click "Scan" to detect updates. Each outdated row shows Device, Current vs Available version, Severity (Critical / Important / Recommended / Optional / Unknown, plus REBOOT and ISSUE badges) and Health (Excellent / Good / Fair / Poor). Tick rows and click "Update Selected" or "Update All", or use per-row "Update". Use per-row "Ignore" and "Ignored" to hide drivers, "History" to audit installs, "Details" / "Compare" for full info, and "Search..." to filter. "Backup" backs up all drivers. "Stop" / "Stop Install" / "Stop Backup" cancel the running operation. Admin rights are required. Before installing, the app runs pre-checks, can auto-backup drivers and create a restore point if enabled, blocks pre-release / untrusted / unsigned packages, and may ask for a manual vendor download. Drivers awaiting restart stay listed with a REBOOT badge until you reboot.
help.section.2=This tab has three sub-tabs. "Rollback drivers" lists driver backups created automatically before driver updates. Use "Refresh", "Search backups...", "Details", "Open Folder", "Verify" and "Repair" to manage them. Select a row and click "Revert" to restore that driver version (admin required, restart may be needed). "Delete" removes one backup; "Delete All" removes all (two-step confirmation — rollback is then impossible). Nothing is deleted automatically. "System restore" is read-only: click "Scan" to list points, "Create new restore point" to create one (admin required), and "Launch restore point" to open the Windows System Restore wizard — the app never restores or deletes points itself. "Registry backup" backs up startup-related registry areas: click "Backup Now", pick core / extended areas plus optional full-hive export, then "Restore Selected" (merges .reg files; .hiv files need manual reg restore) or "Delete Backup".
help.section.3=This tab uses winget plus Windows Update to scan for app and Windows updates. Click "Scan" to check ("Stop scan" cancels). Results show Program, Current / Available Version, Source (winget / WindowsUpdate), Size and Status (no severity levels). Use Search, Source filter and "Failed only" to narrow results, then "Select All" / "Deselect All" and "Update Selected", or per-row "Update". Failed items can be retried with "Retry Failed" (max 3 attempts). If enabled, the app offers one System Restore Point before the batch. A reboot requirement stops the remaining batch — reboot and re-scan. After a successful install you are prompted to delete detected installer files from Downloads to save space. Per-row "Ignore" or "Ignored List" hides apps until unignored. "History" audits OK / Failed installs.
help.section.4=The System Information tab displays detailed hardware and software data. Click "Load System Info" to query, "Refresh" for latest, "Cancel" to stop. Your last snapshot is shown instantly on open. Information is organized into tabs shown only when data exists: Overview, CPU, GPU, RAM, OS, Storage, Motherboard, Network, Audio, Battery, Temperatures, Others, USB Devices, Monitors, Printers, plus Warnings (with collection timings) if anything failed. Others uses a category list; Network, Audio, USB, Monitors and Printers each have their own search box. Click "Export..." to save as TXT, JSON, or HTML, "Copy all" for the full report or "Copy tab" for the visible tab. A banner appears when not running as admin (temperatures / NVMe may be unavailable). This tab is read-only and does not modify any system settings. Field names and gathered values stay in English.
help.section.5=The Uninstaller tab lists installed apps. Toggle "Desktop Apps" / "Windows Store Apps" (Store list/removal is for the current Windows user), click "Scan" ("Cancel" stops listing and size loading; an active Win32 vendor uninstall is left to finish safely, while Store and winget removals are aborted), and use "Search apps..." to filter. Select an app and click "Uninstall" (runs the vendor uninstaller, Interactive or Silent), or "Force Uninstall" as a last resort without it. Select 2+ apps and click "Uninstall Selected" to remove them one-by-one — each app still asks for confirmation, mode, and restore point. After uninstallation, the app scans for leftover files, folders, and registry entries. Review them in the leftovers dialog: files go to the Recycle Bin by default (recoverable), registry keys are backed up to .reg first (checked by default). Only exact matches are pre-selected; heuristic matches show a badge and stay unchecked. Use "High-confidence only" to reset to the safest selection, "Select All" / "Deselect All" / "Export List..." as needed. PATH entries are shown read-only. Use "History" to audit past uninstalls, "Export..." to save the app list as CSV, and "Open Folder" / "Copy" for details. If an entry has no uninstaller, the app offers a winget fallback (with confirmation). Be cautious with force uninstall — it kills processes and deletes files/registry/Start Menu entries and cannot be undone.
help.section.6=This tab manages startup programs and Windows service start types. Items are organized into "Startup apps" (Registry Run/RunOnce + Startup Folder), "Scheduled tasks", and "Windows services" (with counts). The services tab lists all Windows services (Automatic, Manual, and Disabled); Manual services show zero estimated boot impact. Startup Folder items (User and Common) are merged into Startup apps and toggled via StartupApproved (Task Manager-compatible); legacy .disabled renames are still recognized. Services cannot be deleted, only toggled. Click "Scan" ("Stop" cancels and keeps the previous results), then select an item and click "Enable/Disable" or "Delete". Only "Delete" creates a backup in Backups & Restore; toggling does not. Disabling a critical system service asks for extra confirmation. Use per-tab search plus "Status:" / "Impact:" filters, "Select high-impact" to select heavy enabled items, and right-click / double-click for "Open file location", "Copy command", "Show details" and online search. The footer shows total estimated boot delay (enabled items only) and last boot time. Use "Backups & Restore" to restore or permanently delete backups, and "Export CSV" for the visible tab. Modifying HKLM / Common Startup, system tasks or services requires administrator rights. Only modify items you recognize.
help.section.7=The System Cleanup tab scans for unnecessary files. Click "Scan" ("Cancel" stops it) to analyze categories such as temporary files, browser caches, Windows update leftovers, and log files. Each category shows reclaimable Size / Count plus Risk (Low / Medium / High), Status, and Took time. Use Search and the Risk filter to narrow results. Double-click a row (or right-click > "View details...") to preview what will be cleaned. Select categories and click "Clean Selected" (HIGH-risk categories start unchecked and ask for extra confirmation). Use "Refresh selected" to re-scan only selected rows, "Presets..." for saved selections, "Export..." to save the scan as CSV, "History" for past sessions, and right-click > "Ignore category in future scans" to skip a category ("Ignored..." restores skipped categories). If Registry is selected you are offered a .reg backup; a System Restore point can be created automatically if enabled. Some categories require admin. Always review results before cleaning.
help.section.8=The Disk Tools tab has four inner tabs: Defrag, Disk Health, Benchmark and Secure Erase. Defrag: click "Refresh", select visible drives (Filter All / HDD / SSD applies to Analyze / Intelligent Defrag), click "Analyze Selected", then "Intelligent Defrag". Full defrag runs only on confirmed HDDs; SSDs and unknown media get ReTrim. A color-coded grid visualizes fragmentation. Intelligent Defrag requires admin. Disk Health: click "Refresh" for SMART data. Benchmark: pick a drive and size, click "Start Benchmark" for sequential read/write, IOPS and latency ("Stop" cancels). Secure Erase: secure file and folder deletion, Recycle Bin cleanup, and free-space wiping. Shredding and wiping are irreversible — in-use files can be scheduled for deletion on next reboot.
help.section.9=This tab scans installed browsers for extensions. Click "Scan All Browsers" for a full parallel scan, or pick a browser and click "Rescan Browser". Use "Cancel" to stop a running scan or toggle. Filter by Browser, Status, Profile and free-text search. Tick "Auto-scan on open" to scan automatically. Select rows and click "Enable" / "Disable" to toggle without uninstalling (browsers must stay closed). Right-click offers folder, copy, store page, and ignore actions. Use "Export..." to save the filtered list, "Restore Backup..." to roll back a preferences backup, and "Manage Ignored" to review ignored items. Changes take effect after restarting the browser.
help.section.10=The Network Optimizer has sub-tabs (admin required for changes). "Network Adapters" lists interfaces; use Filter, "Refresh", "Enable" / "Disable", "Renew IP" and "Export CSV". "Optimization" applies TCP/IP presets (Default, Maximum Performance, Maximum Stability, Gaming). Use "Preview Changes" and "Apply"; a snapshot is captured before each apply. "DNS & Cache" can flush DNS, reset the network stack or Winsock, and set DNS servers. Diagnostics (DNS benchmark, MTU probe, speed test, ping, traceroute) run only when you click them. "Adapter Settings" is a read-only view. "Wi-Fi" shows the current connection, nearby networks, and saved profiles. "Connection Overview" is read-only (ipconfig, route, arp, netstat). "Change History" lists recent operations. A reboot banner can appear after TCP changes and stack resets.
