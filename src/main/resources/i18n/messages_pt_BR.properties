# English UI strings. Keys are the source text, except help.* keys.
help.intro=Clique em qualquer seção abaixo para expandi-la e aprender a usar esse recurso.
help.contact=Tem uma dúvida, encontrou um bug ou quer sugerir uma melhoria? Adoraríamos ouvir você. Envie-nos um e-mail em:
help.email.copied=Endereço de e-mail copiado para a área de transferência: winzenith_tools@yahoo.com
help.section.0=O Dashboard é o hub de visão geral do seu sistema. Clique em "Scan for issues" para verificar Drivers Desatualizados, Atualizações de Software e oportunidades de Limpeza do Sistema em paralelo. Os resultados aparecem em cartões de resumo e em uma tabela (Categoria | Problemas Encontrados | Tamanho | Origem | Status). Clique em uma linha de categoria para ir direto a essa aba. Use "Stop" para cancelar e "Retry" se uma categoria atingir o tempo limite ou falhar. Sua última verificação é restaurada ao abrir. O Dashboard é somente leitura — ele nunca altera o seu sistema. Ele respeita drivers excluídos e softwares ignorados.
help.section.1=A aba Drivers verifica os dispositivos instalados e consulta o Windows Update, fontes ao vivo NVIDIA/Intel e fornecedores com suporte de catálogo quando dados atualizados do catálogo estão disponíveis (configure WINZENITH_CATALOG_URL para atualizar). Clique em "Scan" para detectar atualizações. Cada linha desatualizada mostra Dispositivo, versão Atual vs Disponível, Severidade (Critical / Important / Recommended / Optional / Unknown, além dos selos REBOOT e ISSUE) e Saúde (Excellent / Good / Fair / Poor). Marque as linhas e clique em "Update Selected" ou "Update All", ou use "Update" por linha. Use "Ignore" e "Ignored" por linha para ocultar drivers, "History" para auditar instalações, "Details" / "Compare" para informações completas e "Search..." para filtrar. "Backup" faz backup de todos os drivers. "Stop" / "Stop Install" / "Stop Backup" cancelam a operação em andamento. Direitos de administrador são necessários. Antes da instalação, o aplicativo executa pré-verificações, pode fazer backup automático dos drivers e criar um ponto de restauração se habilitado, bloqueia pacotes pré-lançamento / não confiáveis / não assinados e pode solicitar um download manual do fornecedor. Drivers aguardando reinício permanecem listados com o selo REBOOT até você reiniciar.
help.section.2=Esta aba tem três sub-abas. "Rollback drivers" lista os backups de drivers criados automaticamente antes das atualizações de drivers. Use "Refresh", "Search backups...", "Details", "Open Folder", "Verify" e "Repair" para gerenciá-los. Selecione uma linha e clique em "Revert" para restaurar aquela versão do driver (admin necessário, reinício pode ser necessário). "Delete" remove um backup; "Delete All" remove todos (confirmação em duas etapas — a reversão fica então impossível). Nada é excluído automaticamente. "System restore" é somente leitura: clique em "Scan" para listar os pontos, "Create new restore point" para criar um (admin necessário) e "Launch restore point" para abrir o assistente de Restauração do Sistema do Windows — o aplicativo nunca restaura nem exclui pontos por conta própria. "Registry backup" faz backup das áreas do registro relacionadas à inicialização: clique em "Backup Now", escolha as áreas principais / estendidas mais a exportação opcional completa do hive, depois "Restore Selected" (mescla arquivos .reg; arquivos .hiv precisam de restauração manual do reg) ou "Delete Backup".
help.section.3=Esta aba usa winget e Windows Update para verificar atualizações de aplicativos e do Windows. Clique em "Scan" para verificar ("Stop scan" cancela). Os resultados mostram Programa, Versão Atual / Disponível, Origem (winget / WindowsUpdate), Tamanho e Status (sem níveis de severidade). Use Pesquisa, filtro de Origem e "Failed only" para restringir os resultados, depois "Select All" / "Deselect All" e "Update Selected", ou "Update" por linha. Itens com falha podem ser tentados novamente com "Retry Failed" (máx. 3 tentativas). Se habilitado, o aplicativo oferece um Ponto de Restauração do Sistema antes do lote. Um requisito de reinício interrompe o restante do lote — reinicie e verifique novamente. Após uma instalação bem-sucedida, você é solicitado a excluir os arquivos de instalador detectados em Downloads para liberar espaço. "Ignore" por linha ou "Ignored List" oculta aplicativos até serem reativados. "History" audita instalações OK / Failed.
help.section.4=A aba Informações do Sistema exibe dados detalhados de hardware e software. Clique em "Load System Info" para consultar, "Refresh" para atualizar, "Cancel" para parar. Seu último snapshot é mostrado instantaneamente ao abrir. As informações são organizadas em abas exibidas somente quando há dados: Overview, CPU, GPU, RAM, OS, Storage, Motherboard, Network, Audio, Battery, Temperatures, Others, USB Devices, Monitors, Printers, além de Warnings (com tempos de coleta) se algo falhou. Others usa uma lista de categorias; Network, Audio, USB, Monitors e Printers têm cada um sua própria caixa de pesquisa. Clique em "Export..." para salvar como TXT, JSON ou HTML, "Copy all" para o relatório completo ou "Copy tab" para a aba visível. Um banner aparece quando não está em execução como admin (temperaturas / NVMe podem ficar indisponíveis). Esta aba é somente leitura e não modifica nenhuma configuração do sistema. Nomes de campos e valores coletados permanecem em inglês.
help.section.5=A aba Desinstalador lista os aplicativos instalados. Alterne "Desktop Apps" / "Windows Store Apps" (a lista/remoção da Store é para o usuário atual do Windows), clique em "Scan" ("Cancel" interrompe a listagem e o carregamento de tamanho; uma desinstalação Win32 ativa do fornecedor é deixada concluir com segurança, enquanto remoções da Store e do winget são abortadas), e use "Search apps..." para filtrar. Selecione um aplicativo e clique em "Uninstall" (executa o desinstalador do fornecedor, Interactive ou Silent), ou "Force Uninstall" como último recurso sem ele. Selecione 2+ aplicativos e clique em "Uninstall Selected" para removê-los um a um — cada aplicativo ainda pede confirmação, modo e ponto de restauração. Após a desinstalação, o aplicativo procura arquivos, pastas e entradas de registro restantes. Revise-os no diálogo de leftovers: os arquivos vão para a Lixeira por padrão (recuperáveis), as chaves de registro são primeiro salvas em .reg (marcadas por padrão). Somente correspondências exatas são pré-selecionadas; correspondências heurísticas mostram um selo e permanecem desmarcadas. Use "High-confidence only" para redefinir para a seleção mais segura, "Select All" / "Deselect All" / "Export List..." conforme necessário. Entradas PATH são mostradas somente leitura. Use "History" para auditar desinstalações anteriores, "Export..." para salvar a lista de aplicativos como CSV e "Open Folder" / "Copy" para detalhes. Se uma entrada não tiver desinstalador, o aplicativo oferece um fallback do winget (com confirmação). Tenha cuidado com a desinstalação forçada — ela encerra processos e exclui arquivos/registro/entradas do Menu Iniciar e não pode ser desfeita.
help.section.6=Esta aba gerencia programas de inicialização e tipos de início de serviços do Windows. Os itens são organizados em "Startup apps" (Registry Run/RunOnce + Startup Folder), "Scheduled tasks" e "Windows services" (com contagens). A aba de serviços lista todos os serviços do Windows (Automatic, Manual e Disabled); serviços Manual mostram impacto estimado de inicialização zero. Itens da Startup Folder (User e Common) são mesclados em Startup apps e alternados via StartupApproved (compatível com o Gerenciador de Tarefas); renomeações legadas .disabled ainda são reconhecidas. Serviços não podem ser excluídos, apenas alternados. Clique em "Scan" ("Stop" cancela e mantém os resultados anteriores), depois selecione um item e clique em "Enable/Disable" ou "Delete". Somente "Delete" cria um backup em Backups & Restore; alternar não cria. Desabilitar um serviço crítico do sistema pede confirmação extra. Use a pesquisa por aba mais os filtros "Status:" / "Impact:", "Select high-impact" para selecionar itens habilitados pesados, e clique com o botão direito / clique duplo para "Open file location", "Copy command", "Show details" e pesquisa online. O rodapé mostra o atraso total estimado de inicialização (somente itens habilitados) e a hora da última inicialização. Use "Backups & Restore" para restaurar ou excluir permanentemente backups, e "Export CSV" para a aba visível. Modificar HKLM / Common Startup, tarefas ou serviços do sistema requer direitos de administrador. Modifique somente itens que você reconhece.
help.section.7=A aba Limpeza do Sistema procura arquivos desnecessários. Clique em "Scan" ("Cancel" interrompe) para analisar categorias como arquivos temporários, caches de navegador, leftovers do Windows Update e arquivos de log. Cada categoria mostra Tamanho / Contagem recuperáveis mais Risco (Low / Medium / High), Status e tempo gasto. Use Pesquisa e o filtro de Risco para restringir os resultados. Clique duas vezes em uma linha (ou clique com o botão direito > "View details...") para visualizar o que será limpo. Selecione categorias e clique em "Clean Selected" (categorias de risco HIGH começam desmarcadas e pedem confirmação extra). Use "Refresh selected" para verificar novamente somente as linhas selecionadas, "Presets..." para seleções salvas, "Export..." para salvar a verificação como CSV, "History" para sessões anteriores e clique com o botão direito > "Ignore category in future scans" para pular uma categoria ("Ignored..." restaura categorias ignoradas). Se Registry estiver selecionado, é oferecido um backup .reg; um ponto de Restauração do Sistema pode ser criado automaticamente se habilitado. Algumas categorias exigem admin. Sempre revise os resultados antes de limpar.
help.section.8=A aba Ferramentas de Disco tem quatro abas internas: Defrag, Disk Health, Benchmark e Secure Erase. Defrag: clique em "Refresh", selecione as unidades visíveis (Filter All / HDD / SSD aplica-se a Analyze / Intelligent Defrag), clique em "Analyze Selected" e depois em "Intelligent Defrag". A desfragmentação completa é executada somente em HDDs confirmados; SSDs e mídias desconhecidas recebem ReTrim. Uma grade com código de cores visualiza a fragmentação. Intelligent Defrag requer admin. Disk Health: clique em "Refresh" para dados SMART. Benchmark: escolha uma unidade e o tamanho, clique em "Start Benchmark" para leitura/gravação sequencial, IOPS e latência ("Stop" cancela). Secure Erase: exclusão segura de arquivos e pastas, limpeza da Lixeira e limpeza de espaço livre. Shredding e wiping são irreversíveis — arquivos em uso podem ser agendados para exclusão na próxima reinicialização.
help.section.9=Esta aba verifica os navegadores instalados em busca de extensões. Clique em "Scan All Browsers" para uma verificação paralela completa, ou escolha um navegador e clique em "Rescan Browser". Use "Cancel" para interromper uma verificação ou alternância em andamento. Filtre por Browser, Status, Profile e pesquisa de texto livre. Marque "Auto-scan on open" para verificar automaticamente. Selecione linhas e clique em "Enable" / "Disable" para alternar sem desinstalar (os navegadores devem permanecer fechados). O clique com o botão direito oferece ações de pasta, copiar, página da loja e ignorar. Use "Export..." para salvar a lista filtrada, "Restore Backup..." para reverter um backup de preferências e "Manage Ignored" para revisar itens ignorados. As alterações entram em vigor após reiniciar o navegador.
help.section.10=O Otimizador de Rede tem sub-abas (admin necessário para alterações). "Network Adapters" lista as interfaces; use Filter, "Refresh", "Enable" / "Disable", "Renew IP" e "Export CSV". "Optimization" aplica predefinições TCP/IP (Default, Maximum Performance, Maximum Stability, Gaming). Use "Preview Changes" e "Apply"; um snapshot é capturado antes de cada aplicação. "DNS & Cache" pode limpar o DNS, redefinir a pilha de rede ou o Winsock e definir servidores DNS. Diagnósticos (benchmark DNS, sonda MTU, teste de velocidade, ping, traceroute) são executados somente quando você clica neles. "Adapter Settings" é uma visualização somente leitura. "Wi-Fi" mostra a conexão atual, redes próximas e perfis salvos. "Connection Overview" é somente leitura (ipconfig, route, arp, netstat). "Change History" lista operações recentes. Um banner de reinício pode aparecer após alterações TCP e redefinições de pilha.
