help.contact=Haben Sie eine Frage, einen Fehler gefunden oder möchten Sie eine Verbesserung vorschlagen? Wir freuen uns über Ihre Nachricht. Senden Sie uns eine E-Mail an:
help.email.copied=E-Mail-Adresse in die Zwischenablage kopiert: winzenith_tools@yahoo.com
help.section.0=Das Dashboard ist Ihre Übersicht der Systemgesundheit. Klicken Sie auf „Nach Problemen suchen“, um veraltete Treiber, Software-Updates und Möglichkeiten zur Systembereinigung parallel zu prüfen. Die Ergebnisse erscheinen in Übersichtskarten sowie in einer Tabelle (Kategorie | Gefundene Probleme | Größe | Quelle | Status). Klicken Sie auf eine Kategoriezeile, um direkt zu diesem Tab zu springen. Mit „Stopp“ brechen Sie ab und nutzen Sie „Erneut versuchen“, wenn eine Kategorie eine Zeitüberschreitung hat oder fehlschlägt. Ihr letzter Scan wird beim Öffnen wiederhergestellt. Das Dashboard ist schreibgeschützt — es ändert Ihr System nie. Es berücksichtigt ausgeschlossene Treiber und übersprungene Software.
help.section.1=Der Treiber-Tab scannt installierte Geräte und prüft Windows Update, Live-Quellen von NVIDIA/Intel sowie kataloggestützte Hersteller, wenn aktuelle Katalogdaten verfügbar sind (WINZENITH_CATALOG_URL konfigurieren zum Aktualisieren). Klicken Sie auf „Scannen“, um Updates zu erkennen. Jede veraltete Zeile zeigt Gerät, aktuelle vs. verfügbare Version, Schweregrad (Kritisch / Wichtig / Empfohlen / Optional / Unbekannt, plus REBOOT- und ISSUE-Badges) und Zustand (Ausgezeichnet / Gut / Mittel / Schlecht). Markieren Sie Zeilen und klicken Sie auf „Ausgewählte aktualisieren“ oder „Alle aktualisieren“, oder nutzen Sie „Aktualisieren“ pro Zeile. Mit „Ignorieren“ und „Ignoriert“ pro Zeile blenden Sie Treiber aus, mit „Verlauf“ prüfen Sie Installationen, mit „Details“ / „Vergleichen“ erhalten Sie vollständige Infos, und mit „Suchen...“ filtern Sie. „Sicherung“ sichert alle Treiber. „Stopp“ / „Installation stoppen“ / „Sicherung stoppen“ brechen den laufenden Vorgang ab. Administratorrechte sind erforderlich. Vor der Installation führt die App Vorprüfungen durch, kann Treiber automatisch sichern und einen Wiederherstellungspunkt erstellen, wenn aktiviert, blockiert Vorab-/nicht vertrauenswürdige/unsignierte Pakete und kann einen manuellen Hersteller-Download anfordern. Treiber, die auf einen Neustart warten, bleiben mit REBOOT-Badge aufgeführt, bis Sie neu starten.
help.section.2=Dieser Tab hat drei Unter-Tabs. „Treiber zurücksetzen“ listet Treibersicherungen, die automatisch vor Treiber-Updates erstellt wurden. Nutzen Sie „Aktualisieren“, „Sicherungen suchen...“, „Details“, „Ordner öffnen“, „Prüfen“ und „Reparieren“ zur Verwaltung. Wählen Sie eine Zeile und klicken Sie auf „Zurücksetzen“, um diese Treiberversion wiederherzustellen (Administrator erforderlich, Neustart kann nötig sein). „Löschen“ entfernt eine Sicherung; „Alle löschen“ entfernt alle (zweistufige Bestätigung — ein Zurücksetzen ist danach unmöglich). Nichts wird automatisch gelöscht. „Systemwiederherstellung“ ist schreibgeschützt: klicken Sie auf „Scannen“, um Punkte aufzulisten, „Neuen Wiederherstellungspunkt erstellen“, um einen zu erstellen (Administrator erforderlich), und „Wiederherstellungspunkt starten“, um den Windows-Systemwiederherstellungs-Assistenten zu öffnen — die App stellt Punkte selbst nie wieder her und löscht sie nicht. „Registrierungssicherung“ sichert startbezogene Registrierungsbereiche: klicken Sie auf „Jetzt sichern“, wählen Sie Kern-/erweiterte Bereiche sowie optional den vollständigen Hive-Export, dann „Ausgewählte wiederherstellen“ (führt .reg-Dateien zusammen; .hiv-Dateien erfordern manuelles reg restore) oder „Sicherung löschen“.
help.section.3=Dieser Tab nutzt winget plus Windows Update, um nach App- und Windows-Updates zu suchen. Klicken Sie auf „Scannen“ zum Prüfen („Scan stoppen“ bricht ab). Die Ergebnisse zeigen Programm, aktuelle / verfügbare Version, Quelle (winget / WindowsUpdate), Größe und Status (keine Schweregrade). Nutzen Sie Suche, Quellenfilter und „Nur fehlgeschlagen“, um einzugrenzen, dann „Alle auswählen“ / „Auswahl aufheben“ und „Ausgewählte aktualisieren“, oder „Aktualisieren“ pro Zeile. Fehlgeschlagene Einträge können mit „Fehlgeschlagene erneut versuchen“ wiederholt werden (max. 3 Versuche). Wenn aktiviert, bietet die App vor dem Stapel einen Systemwiederherstellungspunkt an. Eine Neustartanforderung stoppt den restlichen Stapel — neu starten und erneut scannen. Nach einer erfolgreichen Installation werden Sie aufgefordert, erkannte Installationsdateien aus Downloads zu löschen, um Speicherplatz zu sparen. Mit „Ignorieren“ pro Zeile oder „Ignorierliste“ blenden Sie Apps aus, bis sie wieder freigegeben werden. „Verlauf“ prüft OK-/fehlgeschlagene Installationen.
help.section.4=Der Systeminformations-Tab zeigt detaillierte Hardware- und Softwaredaten. Klicken Sie auf „Systeminformationen laden“ zum Abfragen, „Aktualisieren“ für die neuesten Daten, „Abbrechen“ zum Stoppen. Ihr letzter Snapshot wird beim Öffnen sofort angezeigt. Die Informationen sind in Tabs organisiert, die nur erscheinen, wenn Daten vorhanden sind: Übersicht, CPU, GPU, RAM, OS, Speicher, Mainboard, Netzwerk, Audio, Akku, Temperaturen, Sonstiges, USB-Geräte, Monitore, Drucker sowie Warnungen (mit Erfassungszeiten), falls etwas fehlgeschlagen ist. Sonstiges nutzt eine Kategorieliste; Netzwerk, Audio, USB, Monitore und Drucker haben jeweils ein eigenes Suchfeld. Klicken Sie auf „Exportieren...“, um als TXT, JSON oder HTML zu speichern, „Alles kopieren“ für den vollständigen Bericht oder „Tab kopieren“ für den sichtbaren Tab. Ein Banner erscheint, wenn nicht als Administrator ausgeführt wird (Temperaturen / NVMe sind möglicherweise nicht verfügbar). Dieser Tab ist schreibgeschützt und ändert keine Systemeinstellungen. Feldnamen und erfasste Werte bleiben auf Englisch.
help.section.5=Der Deinstallations-Tab listet installierte Apps. Schalten Sie „Desktop-Apps“ / „Windows Store-Apps“ um (Store-Liste/Entfernung gilt für den aktuellen Windows-Benutzer), klicken Sie auf „Scannen“ („Abbrechen“ stoppt Auflistung und Größenladung; eine aktive Win32-Hersteller-Deinstallation wird sicher zu Ende geführt, während Store- und winget-Entfernungen abgebrochen werden), und nutzen Sie „Apps suchen...“ zum Filtern. Wählen Sie eine App und klicken Sie auf „Deinstallieren“ (führt den Hersteller-Deinstaller aus, Interaktiv oder Stumm), oder „Erzwungen deinstallieren“ als letzten Ausweg ohne ihn. Wählen Sie 2+ Apps und klicken Sie auf „Ausgewählte deinstallieren“, um sie nacheinander zu entfernen — jede App fragt weiterhin nach Bestätigung, Modus und Wiederherstellungspunkt. Nach der Deinstallation scannt die App nach verbleibenden Dateien, Ordnern und Registrierungseinträgen. Prüfen Sie sie im Reste-Dialog: Dateien landen standardmäßig im Papierkorb (wiederherstellbar), Registrierungsschlüssel werden zuerst als .reg gesichert (standardmäßig aktiviert). Nur exakte Treffer sind vorausgewählt; heuristische Treffer zeigen ein Badge und bleiben unmarkiert. Nutzen Sie „Nur hohe Sicherheit“, um auf die sicherste Auswahl zurückzusetzen, sowie „Alle auswählen“ / „Auswahl aufheben“ / „Liste exportieren...“ nach Bedarf. PATH-Einträge werden schreibgeschützt angezeigt. Nutzen Sie „Verlauf“, um vergangene Deinstallationen zu prüfen, „Exportieren...“, um die App-Liste als CSV zu speichern, und „Ordner öffnen“ / „Kopieren“ für Details. Wenn ein Eintrag keinen Deinstaller hat, bietet die App einen winget-Fallback an (mit Bestätigung). Seien Sie vorsichtig bei erzwungener Deinstallation — sie beendet Prozesse und löscht Dateien/Registrierung/Startmenü-Einträge und kann nicht rückgängig gemacht werden.
help.section.6=Dieser Tab verwaltet Autostart-Programme und Starttypen von Windows-Diensten. Einträge sind organisiert in „Autostart-Apps“ (Registry Run/RunOnce + Autostart-Ordner), „Geplante Aufgaben“ und „Windows-Dienste“ (mit Anzahl). Der Dienste-Tab listet alle Windows-Dienste (Automatisch, Manuell und Deaktiviert); manuelle Dienste zeigen keine geschätzte Boot-Auswirkung. Autostart-Ordner-Einträge (Benutzer und Gemeinsam) werden in Autostart-Apps zusammengeführt und über StartupApproved umgeschaltet (Task-Manager-kompatibel); ältere .disabled-Umbenennungen werden weiterhin erkannt. Dienste können nicht gelöscht, nur umgeschaltet werden. Klicken Sie auf „Scannen“ („Stopp“ bricht ab und behält die vorherigen Ergebnisse), wählen Sie dann einen Eintrag und klicken Sie auf „Aktivieren/Deaktivieren“ oder „Löschen“. Nur „Löschen“ erstellt eine Sicherung unter Sicherungen & Wiederherstellen; Umschalten nicht. Das Deaktivieren eines kritischen Systemdienstes verlangt eine zusätzliche Bestätigung. Nutzen Sie die Suche pro Tab sowie Filter „Status:“ / „Auswirkung:“, „Hohe Auswirkung auswählen“, um schwere aktivierte Einträge zu markieren, und Rechtsklick / Doppelklick für „Dateipfad öffnen“, „Befehl kopieren“, „Details anzeigen“ und Onlinesuche. Die Fußzeile zeigt die geschätzte Gesamtverzögerung beim Booten (nur aktivierte Einträge) und die letzte Bootzeit. Nutzen Sie „Sicherungen & Wiederherstellen“, um Sicherungen wiederherzustellen oder dauerhaft zu löschen, und „CSV exportieren“ für den sichtbaren Tab. Änderungen an HKLM / gemeinsamem Autostart, Systemaufgaben oder Diensten erfordern Administratorrechte. Ändern Sie nur Einträge, die Sie erkennen.
help.section.7=Der Systembereinigungs-Tab scannt nach unnötigen Dateien. Klicken Sie auf „Scannen“ („Abbrechen“ stoppt), um Kategorien wie temporäre Dateien, Browser-Caches, Windows-Update-Reste und Protokolldateien zu analysieren. Jede Kategorie zeigt freigebbare Größe / Anzahl sowie Risiko (Niedrig / Mittel / Hoch), Status und Dauer. Nutzen Sie Suche und den Risiko-Filter, um einzugrenzen. Doppelklicken Sie auf eine Zeile (oder Rechtsklick > „Details anzeigen...“), um eine Vorschau dessen zu sehen, was bereinigt wird. Wählen Sie Kategorien und klicken Sie auf „Ausgewählte bereinigen“ (Kategorien mit HOHEM Risiko starten unmarkiert und verlangen eine zusätzliche Bestätigung). Nutzen Sie „Ausgewählte aktualisieren“, um nur ausgewählte Zeilen erneut zu scannen, „Voreinstellungen...“ für gespeicherte Auswahlen, „Exportieren...“, um den Scan als CSV zu speichern, „Verlauf“ für vergangene Sitzungen und Rechtsklick > „Kategorie bei zukünftigen Scans ignorieren“, um eine Kategorie zu überspringen („Ignoriert...“ stellt übersprungene Kategorien wieder her). Wenn Registrierung ausgewählt ist, wird eine .reg-Sicherung angeboten; ein Systemwiederherstellungspunkt kann automatisch erstellt werden, wenn aktiviert. Einige Kategorien erfordern Admin. Prüfen Sie die Ergebnisse immer vor dem Bereinigen.
help.section.8=Der Festplatten-Tools-Tab hat vier innere Tabs: Defrag, Festplattenzustand, Benchmark und Sicheres Löschen. Defrag: klicken Sie auf „Aktualisieren“, wählen Sie sichtbare Laufwerke (Filter Alle / HDD / SSD gilt für Analysieren / Intelligente Defragmentierung), klicken Sie auf „Ausgewählte analysieren“, dann „Intelligente Defragmentierung“. Volle Defragmentierung läuft nur auf bestätigten HDDs; SSDs und unbekannte Medien erhalten ReTrim. Ein farbcodiertes Raster visualisiert die Fragmentierung. Intelligente Defragmentierung erfordert Admin. Festplattenzustand: klicken Sie auf „Aktualisieren“ für SMART-Daten. Benchmark: wählen Sie ein Laufwerk und eine Größe, klicken Sie auf „Benchmark starten“ für sequenzielles Lesen/Schreiben, IOPS und Latenz („Stopp“ bricht ab). Sicheres Löschen: sicheres Löschen von Dateien und Ordnern, Papierkorb-Bereinigung und Überschreiben von freiem Speicherplatz. Schreddern und Überschreiben sind irreversibel — in Verwendung befindliche Dateien können für die Löschung beim nächsten Neustart geplant werden.
help.section.9=Dieser Tab scannt installierte Browser nach Erweiterungen. Klicken Sie auf „Alle Browser scannen“ für einen vollständigen parallelen Scan, oder wählen Sie einen Browser und klicken Sie auf „Browser erneut scannen“. Mit „Abbrechen“ stoppen Sie einen laufenden Scan oder Umschaltvorgang. Filtern Sie nach Browser, Status, Profil und Freitextsuche. Aktivieren Sie „Beim Öffnen automatisch scannen“, um automatisch zu scannen. Wählen Sie Zeilen und klicken Sie auf „Aktivieren“ / „Deaktivieren“, um ohne Deinstallation umzuschalten (Browser müssen geschlossen bleiben). Rechtsklick bietet Ordner, Kopieren, Store-Seite und Ignorieren. Nutzen Sie „Exportieren...“, um die gefilterte Liste zu speichern, „Sicherung wiederherstellen...“, um eine Einstellungs-Sicherung zurückzurollen, und „Ignorierte verwalten“, um ignorierte Einträge zu prüfen. Änderungen wirken nach dem Neustart des Browsers.
help.section.10=Der Netzwerk-Optimizer hat Unter-Tabs (Admin für Änderungen erforderlich). „Netzwerkadapter“ listet Schnittstellen; nutzen Sie Filter, „Aktualisieren“, „Aktivieren“ / „Deaktivieren“, „IP erneuern“ und „CSV exportieren“. „Optimierung“ wendet TCP/IP-Voreinstellungen an (Standard, Maximale Leistung, Maximale Stabilität, Gaming). Nutzen Sie „Änderungen vorschauen“ und „Anwenden“; vor jedem Anwenden wird ein Snapshot erfasst. „DNS & Cache“ kann DNS leeren, den Netzwerkstapel oder Winsock zurücksetzen und DNS-Server setzen. Diagnosen (DNS-Benchmark, MTU-Prüfung, Geschwindigkeitstest, Ping, Traceroute) laufen nur, wenn Sie darauf klicken. „Adaptereinstellungen“ ist eine schreibgeschützte Ansicht. „Wi-Fi“ zeigt die aktuelle Verbindung, nahe Netzwerke und gespeicherte Profile. „Verbindungsübersicht“ ist schreibgeschützt (ipconfig, route, arp, netstat). „Änderungsverlauf“ listet letzte Vorgänge. Ein Neustart-Banner kann nach TCP-Änderungen und Netzwerkstapel-Resets erscheinen.
