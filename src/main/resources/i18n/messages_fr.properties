# French (France) UI strings. Keys are the source text, except help.* keys.
help.intro=Cliquez sur une section ci-dessous pour la développer et découvrir comment utiliser cette fonctionnalité.
help.contact=Une question, un bug, ou une idée d'amélioration ? Nous serions ravis de vous lire. Envoyez-nous un e-mail à :
help.email.copied=Adresse e-mail copiée dans le presse-papiers : winzenith_tools@yahoo.com
help.section.0=Le Tableau de bord est votre hub d'aperçu système. Cliquez sur « Scan for issues » pour vérifier en parallèle les pilotes obsolètes, les mises à jour logicielles et les opportunités de nettoyage. Les résultats apparaissent dans des cartes récapitulatives et un tableau (Category | Issues Found | Size | Source | Status). Cliquez sur une ligne de catégorie pour ouvrir l'onglet correspondant. Utilisez « Stop » pour annuler et « Retry » si une catégorie expire ou échoue. Votre dernier scan est restauré à l'ouverture. Le Tableau de bord est en lecture seule — il ne modifie jamais votre système. Il respecte les pilotes exclus et les logiciels ignorés.
help.section.1=L'onglet Pilotes analyse les périphériques installés et interroge Windows Update, les sources live NVIDIA/Intel, et les éditeurs du catalogue lorsque des données à jour sont disponibles (configurez WINZENITH_CATALOG_URL pour rafraîchir). Cliquez sur « Scan » pour détecter les mises à jour. Chaque ligne obsolète affiche Device, versions Current vs Available, Severity (Critical / Important / Recommended / Optional / Unknown, plus badges REBOOT et ISSUE) et Health (Excellent / Good / Fair / Poor). Cochez des lignes et cliquez sur « Update Selected » ou « Update All », ou utilisez « Update » par ligne. Utilisez « Ignore » et « Ignored » pour masquer des pilotes, « History » pour auditer les installations, « Details » / « Compare » pour le détail, et « Search...» pour filtrer. « Backup » sauvegarde tous les pilotes. « Stop » / « Stop Install » / « Stop Backup » annulent l'opération en cours. Les droits administrateur sont requis. Avant l'installation, l'application effectue des pré-contrôles, peut sauvegarder automatiquement les pilotes et créer un point de restauration si activé, bloque les paquets préversion / non fiables / non signés, et peut demander un téléchargement manuel chez l'éditeur. Les pilotes en attente de redémarrage restent listés avec un badge REBOOT jusqu'au redémarrage.
help.section.2=Cet onglet comporte trois sous-onglets. « Rollback drivers » liste les sauvegardes de pilotes créées automatiquement avant les mises à jour. Utilisez « Refresh », « Search backups... », « Details », « Open Folder », « Verify » et « Repair » pour les gérer. Sélectionnez une ligne et cliquez sur « Revert » pour restaurer cette version de pilote (admin requis, redémarrage possible). « Delete » supprime une sauvegarde ; « Delete All » les supprime toutes (confirmation en deux étapes — le rollback devient alors impossible). Rien n'est supprimé automatiquement. « System restore » est en lecture seule : cliquez sur « Scan » pour lister les points, « Create new restore point » pour en créer un (admin requis), et « Launch restore point » pour ouvrir l'assistant Restauration du système Windows — l'application ne restaure ni ne supprime jamais les points elle-même. « Registry backup » sauvegarde les zones de registre liées au démarrage : cliquez sur « Backup Now », choisissez les zones core / extended plus l'export complet de hive optionnel, puis « Restore Selected » (fusionne les fichiers .reg ; les fichiers .hiv nécessitent une restauration reg manuelle) ou « Delete Backup ».
help.section.3=Cet onglet utilise winget et Windows Update pour rechercher les mises à jour d'applications et de Windows. Cliquez sur « Scan » pour vérifier (« Stop scan » annule). Les résultats affichent Program, Current / Available Version, Source (winget / WindowsUpdate), Size et Status (pas de niveaux de sévérité). Utilisez Search, le filtre Source et « Failed only » pour affiner, puis « Select All » / « Deselect All » et « Update Selected », ou « Update » par ligne. Les éléments échoués peuvent être relancés avec « Retry Failed » (3 tentatives max). Si activé, l'application propose un point de restauration système avant le lot. Une exigence de redémarrage interrompt le reste du lot — redémarrez et relancez le scan. Après une installation réussie, vous êtes invité à supprimer les installateurs détectés dans Téléchargements pour gagner de l'espace. « Ignore » par ligne ou « Ignored List » masque les applications jusqu'à réactivation. « History » audite les installations OK / Failed.
help.section.4=L'onglet Informations système affiche des données matérielles et logicielles détaillées. Cliquez sur « Load System Info » pour interroger, « Refresh » pour actualiser, « Cancel » pour arrêter. Votre dernier instantané s'affiche immédiatement à l'ouverture. Les informations sont organisées en onglets affichés uniquement s'il y a des données : Overview, CPU, GPU, RAM, OS, Storage, Motherboard, Network, Audio, Battery, Temperatures, Others, USB Devices, Monitors, Printers, plus Warnings (avec durées de collecte) en cas d'échec. Others utilise une liste de catégories ; Network, Audio, USB, Monitors et Printers ont chacun leur zone de recherche. Cliquez sur « Export... » pour enregistrer en TXT, JSON ou HTML, « Copy all » pour le rapport complet ou « Copy tab » pour l'onglet visible. Une bannière apparaît si vous n'êtes pas admin (températures / NVMe peuvent être indisponibles). Cet onglet est en lecture seule et ne modifie aucun paramètre système. Les noms de champs et les valeurs collectées restent en anglais.
help.section.5=L'onglet Désinstalleur liste les applications installées. Basculez « Desktop Apps » / « Windows Store Apps » (la liste/suppression Store concerne l'utilisateur Windows actuel), cliquez sur « Scan » (« Cancel » arrête le listage et le chargement des tailles ; une désinstallation Win32 de l'éditeur en cours est laissée se terminer en toute sécurité, tandis que les suppressions Store et winget sont annulées), et utilisez « Search apps... » pour filtrer. Sélectionnez une application et cliquez sur « Uninstall » (lance le désinstalleur éditeur, Interactive ou Silent), ou « Force Uninstall » en dernier recours sans celui-ci. Sélectionnez 2+ applications et cliquez sur « Uninstall Selected » pour les retirer une par une — chaque application demande encore confirmation, mode et point de restauration. Après la désinstallation, l'application recherche fichiers, dossiers et entrées de registre restants. Examinez-les dans la boîte de dialogue des restes : les fichiers vont à la Corbeille par défaut (récupérables), les clés de registre sont d'abord sauvegardées en .reg (coché par défaut). Seules les correspondances exactes sont présélectionnées ; les correspondances heuristiques affichent un badge et restent décochées. Utilisez « High-confidence only » pour revenir à la sélection la plus sûre, « Select All » / « Deselect All » / « Export List... » selon besoin. Les entrées PATH sont en lecture seule. Utilisez « History » pour auditer les désinstallations, « Export... » pour enregistrer la liste en CSV, et « Open Folder » / « Copy » pour les détails. Sans désinstalleur, l'application propose un recours winget (avec confirmation). Soyez prudent avec la désinstallation forcée — elle tue des processus et supprime fichiers/registre/entrées du menu Démarrer, sans retour possible.
help.section.6=Cet onglet gère les programmes de démarrage et les types de démarrage des services Windows. Les éléments sont organisés en « Startup apps » (Registry Run/RunOnce + Startup Folder), « Scheduled tasks » et « Windows services » (avec compteurs). L'onglet services liste tous les services Windows (Automatic, Manual et Disabled) ; les services Manual ont un impact de démarrage estimé à zéro. Les éléments Startup Folder (User et Common) sont fusionnés dans Startup apps et basculés via StartupApproved (compatible Gestionnaire des tâches) ; les renommages .disabled hérités sont encore reconnus. Les services ne peuvent pas être supprimés, seulement basculés. Cliquez sur « Scan » (« Stop » annule et conserve les résultats précédents), puis sélectionnez un élément et cliquez sur « Enable/Disable » ou « Delete ». Seul « Delete » crée une sauvegarde dans Backups & Restore ; le basculement n'en crée pas. Désactiver un service système critique demande une confirmation supplémentaire. Utilisez la recherche par onglet plus les filtres « Status: » / « Impact: », « Select high-impact » pour sélectionner les éléments lourds activés, et clic droit / double-clic pour « Open file location », « Copy command », « Show details » et la recherche en ligne. Le pied de page affiche le délai de démarrage estimé total (éléments activés uniquement) et l'heure du dernier démarrage. Utilisez « Backups & Restore » pour restaurer ou supprimer définitivement des sauvegardes, et « Export CSV » pour l'onglet visible. Modifier HKLM / Common Startup, les tâches système ou les services nécessite les droits administrateur. Ne modifiez que les éléments que vous reconnaissez.
help.section.7=L'onglet Nettoyage système recherche les fichiers inutiles. Cliquez sur « Scan » (« Cancel » l'arrête) pour analyser des catégories comme fichiers temporaires, caches navigateur, restes de mises à jour Windows et fichiers journaux. Chaque catégorie affiche Size / Count récupérables plus Risk (Low / Medium / High), Status et Took. Utilisez Search et le filtre Risk pour affiner. Double-cliquez une ligne (ou clic droit > « View details... ») pour prévisualiser le nettoyage. Sélectionnez des catégories et cliquez sur « Clean Selected » (les catégories HIGH démarrent décochées et demandent une confirmation supplémentaire). Utilisez « Refresh selected » pour rescanner uniquement les lignes sélectionnées, « Presets... » pour les sélections enregistrées, « Export... » pour enregistrer le scan en CSV, « History » pour les sessions passées, et clic droit > « Ignore category in future scans » pour ignorer une catégorie (« Ignored... » restaure les catégories ignorées). Si Registry est sélectionné, une sauvegarde .reg est proposée ; un point de restauration système peut être créé automatiquement si activé. Certaines catégories exigent l'admin. Examinez toujours les résultats avant de nettoyer.
help.section.8=L'onglet Outils disque a quatre sous-onglets : Defrag, Disk Health, Benchmark et Secure Erase. Defrag : cliquez sur « Refresh », sélectionnez les lecteurs visibles (Filter All / HDD / SSD s'applique à Analyze / Intelligent Defrag), cliquez sur « Analyze Selected », puis « Intelligent Defrag ». La défragmentation complète ne s'exécute que sur les HDD confirmés ; les SSD et médias inconnus reçoivent ReTrim. Une grille colorée visualise la fragmentation. Intelligent Defrag nécessite l'admin. Disk Health : cliquez sur « Refresh » pour les données SMART. Benchmark : choisissez un lecteur et une taille, cliquez sur « Start Benchmark » pour lecture/écriture séquentielle, IOPS et latence (« Stop » annule). Secure Erase : suppression sécurisée de fichiers et dossiers, nettoyage de la Corbeille et effacement de l'espace libre. Le déchiquetage et l'effacement sont irréversibles — les fichiers en cours d'utilisation peuvent être planifiés pour suppression au prochain redémarrage.
help.section.9=Cet onglet analyse les navigateurs installés à la recherche d'extensions. Cliquez sur « Scan All Browsers » pour un scan parallèle complet, ou choisissez un navigateur et cliquez sur « Rescan Browser ». Utilisez « Cancel » pour arrêter un scan ou basculement en cours. Filtrez par Browser, Status, Profile et recherche libre. Cochez « Auto-scan on open » pour scanner automatiquement. Sélectionnez des lignes et cliquez sur « Enable » / « Disable » pour basculer sans désinstaller (les navigateurs doivent rester fermés). Le clic droit propose dossier, copie, page du magasin et ignore. Utilisez « Export... » pour enregistrer la liste filtrée, « Restore Backup... » pour restaurer une sauvegarde de préférences, et « Manage Ignored » pour revoir les éléments ignorés. Les changements prennent effet après redémarrage du navigateur.
help.section.10=L'Optimiseur réseau a des sous-onglets (admin requis pour les modifications). « Network Adapters » liste les interfaces ; utilisez Filter, « Refresh », « Enable » / « Disable », « Renew IP » et « Export CSV ». « Optimization » applique des préréglages TCP/IP (Default, Maximum Performance, Maximum Stability, Gaming). Utilisez « Preview Changes » et « Apply » ; un instantané est capturé avant chaque application. « DNS & Cache » peut vider le DNS, réinitialiser la pile réseau ou Winsock, et définir les serveurs DNS. Les diagnostics (benchmark DNS, sonde MTU, test de débit, ping, traceroute) ne s'exécutent que lorsque vous cliquez dessus. « Adapter Settings » est une vue en lecture seule. « Wi-Fi » montre la connexion actuelle, les réseaux à proximité et les profils enregistrés. « Connection Overview » est en lecture seule (ipconfig, route, arp, netstat). « Change History » liste les opérations récentes. Une bannière de redémarrage peut apparaître après des changements TCP et des réinitialisations de pile.
